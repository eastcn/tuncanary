name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Offline tests
        run: scripts/test.sh
      - name: Build app bundle
        run: scripts/build-app.sh
