name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'public static let version = "([^"\n]+)"', Path('Sources/TunCanaryCore/Basics/AppIdentity.swift').read_text()).group(1)
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a stable version tag'
          assert tag == 'v' + version, 'Tag does not match app version'
          assert Path('docs/releases', tag + '.md').is_file(), 'Missing release notes'
          PY
      - name: Offline tests
        run: scripts/test.sh
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/build-app.sh
          test "$(build/TunCanary.app/Contents/MacOS/TunCanary --version)" = "TunCanary ${RELEASE_TAG#v}"
          codesign --verify --deep --strict build/TunCanary.app
          archive="TunCanary-${RELEASE_TAG#v}-macOS-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent build/TunCanary.app "build/$archive"
          (cd build && shasum -a 256 "$archive" > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TunCanary ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" build/TunCanary-*.zip build/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
